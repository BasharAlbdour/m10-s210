# Stretch Thu — 5-service coordinator stack (graded deliverable).
#
# The 5 microservices are: coordinator, classifier_svc, nlp_svc,
# kg_svc, rag_svc. Healthcheck on every service; coordinator
# depends_on the classifier and the three backends with
# `condition: service_healthy` (bare depends_on lists wait only
# for container start, not ready).
#
# Optional persistence tier: if your kg_svc and rag_svc wire to
# real Neo4j and Weaviate backends, add them here too — the
# resulting topology is 7 services. The graded deliverable is the
# 5-service stack; the persistence tier is optional and reused
# from the Integration when needed.
#
# TODO (learner): author this file.
# - services: coordinator, classifier_svc, nlp_svc, kg_svc, rag_svc.
# - Each service has /healthz and a healthcheck.
# - coordinator depends on all four downstream services with
#   condition: service_healthy.

networks:
  backend:
    driver: bridge

services:

  classifier_svc:
    build:
      context: ./services/classifier_svc
    ports:
      - "8001:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nlp_svc:
    build:
      context: ./services/nlp_svc
    ports:
      - "8002:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  kg_svc:
    build:
      context: ./services/kg_svc
    ports:
      - "8003:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  rag_svc:
    build:
      context: ./services/rag_svc
    ports:
      - "8004:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  coordinator:
    build:
      context: ./coordinator
    ports:
      - "8000:8000"
    networks:
      - backend
    depends_on:
      classifier_svc:
        condition: service_healthy
      nlp_svc:
        condition: service_healthy
      kg_svc:
        condition: service_healthy
      rag_svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s